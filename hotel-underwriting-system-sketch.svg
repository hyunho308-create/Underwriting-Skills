<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1250" role="img" aria-labelledby="title description">
  <title id="title">Hotel Underwriting Information System</title>
  <desc id="description">Deal-room files and online sources flow through organizational, extraction, and research skills into staged and source-linked information primitives, which later support underwriting outputs.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#27313a"/>
    </marker>
    <style>
      .page { fill: #fff; }
      .box { fill: #fff; stroke: #27313a; stroke-width: 3; rx: 5; }
      .thin-box { fill: #fff; stroke: #27313a; stroke-width: 2; rx: 3; }
      .line { fill: none; stroke: #27313a; stroke-width: 3; marker-end: url(#arrow); }
      .divider { stroke: #27313a; stroke-width: 3; }
      .title { fill: #27313a; font: 40px Calibri, "Segoe UI", Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .section { fill: #27313a; font: 34px Calibri, "Segoe UI", Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .group { fill: #27313a; font: 27px Calibri, "Segoe UI", Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .label { fill: #27313a; font: 23px Calibri, "Segoe UI", Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .skill { fill: #27313a; font: 30px Calibri, "Segoe UI", Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .small { fill: #27313a; font: 20px Calibri, "Segoe UI", Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .muted { fill: #6f767d; font: 18px Calibri, "Segoe UI", Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .primitive-title { fill: #27313a; font: 30px Calibri, "Segoe UI", Arial, sans-serif; text-anchor: middle; }
      .primitive { fill: #27313a; font: 18px Calibri, "Segoe UI", Arial, sans-serif; }
      .label-mask { fill: #fff; }
    </style>
  </defs>

  <rect class="page" width="1500" height="1250"/>

  <!-- Source branches -->
  <rect class="box" x="60" y="45" width="640" height="88"/>
  <text class="title" x="380" y="89">Deal Room Files</text>

  <rect class="box" x="800" y="45" width="640" height="88"/>
  <text class="title" x="1120" y="89">Online Sources</text>

  <!-- Organizational skills -->
  <rect class="box" x="75" y="165" width="175" height="72"/>
  <rect class="box" x="292.5" y="165" width="175" height="72"/>
  <rect class="box" x="510" y="165" width="175" height="72"/>
  <text class="label" x="162.5" y="201">Create Project</text>
  <text class="label" x="380" y="201">Inventory Files</text>
  <text class="label" x="597.5" y="201">Categorize Files</text>
  <path class="line" d="M250 201 H284"/>
  <path class="line" d="M467.5 201 H501.5"/>
  <path class="line" d="M597.5 237 V272"/>

  <rect class="box" x="75" y="280" width="610" height="62"/>
  <text class="section" x="380" y="311">Source Metadata • sources.jsonl</text>

  <!-- File extraction arrows -->
  <text class="group" x="380" y="377">File Extraction Skills</text>
  <path class="line" d="M170 405 V612"/>
  <path class="line" d="M380 405 V612"/>
  <path class="line" d="M590 405 V612"/>
  <rect class="label-mask" x="92" y="482" width="156" height="42"/>
  <rect class="label-mask" x="300" y="482" width="160" height="42"/>
  <rect class="label-mask" x="496" y="465" width="188" height="76"/>
  <text class="skill" x="170" y="503">OM Extraction</text>
  <text class="skill" x="380" y="503">Pace Extraction</text>
  <text class="skill" x="590" y="490">
    <tspan x="590" dy="0">Agreement</tspan>
    <tspan x="590" dy="34">Extraction</tspan>
  </text>

  <!-- Online research arrows -->
  <text class="group" x="1120" y="177">Online Research Skills</text>
  <path class="line" d="M910 205 V612"/>
  <path class="line" d="M1120 205 V612"/>
  <path class="line" d="M1330 205 V612"/>
  <rect class="label-mask" x="835" y="381" width="150" height="42"/>
  <rect class="label-mask" x="1042" y="381" width="156" height="42"/>
  <rect class="label-mask" x="1252" y="381" width="156" height="42"/>
  <text class="skill" x="910" y="402">Property Tax</text>
  <text class="skill" x="1120" y="402">Market Wages</text>
  <text class="skill" x="1330" y="402">Guest Reviews</text>

  <!-- Information layer -->
  <rect class="box" x="60" y="620" width="1380" height="350"/>
  <line class="divider" x1="60" y1="680" x2="1440" y2="680"/>
  <text class="section" x="750" y="650">Information Layer</text>

  <rect class="thin-box" x="80" y="696" width="1340" height="38"/>
  <text class="small" x="750" y="715">JSON staging bundles • model-produced findings</text>
  <text class="muted" x="750" y="752">↓ validate, assign stable IDs, and apply</text>
  <rect class="thin-box" x="80" y="770" width="1340" height="38"/>
  <text class="small" x="750" y="789">evidence.jsonl • source-linked information primitives</text>

  <!-- Information buckets -->
  <text class="group" x="500" y="840">Information Buckets</text>
  <rect class="thin-box" x="90" y="858" width="190" height="46"/>
  <rect class="thin-box" x="295" y="858" width="190" height="46"/>
  <rect class="thin-box" x="500" y="858" width="190" height="46"/>
  <rect class="thin-box" x="705" y="858" width="190" height="46"/>
  <rect class="thin-box" x="90" y="916" width="190" height="46"/>
  <rect class="thin-box" x="295" y="916" width="190" height="46"/>
  <rect class="thin-box" x="500" y="916" width="190" height="46"/>
  <rect class="thin-box" x="705" y="916" width="190" height="46"/>
  <text class="label" x="185" y="881">Property</text>
  <text class="label" x="390" y="881">CapEx</text>
  <text class="label" x="595" y="881">Manager / Brand</text>
  <text class="label" x="800" y="881">Labor</text>
  <text class="label" x="185" y="939">Tax</text>
  <text class="label" x="390" y="939">Market</text>
  <text class="label" x="595" y="939">Comp Set / STR</text>
  <text class="label" x="800" y="939">SWOT Candidates</text>

  <!-- Primitive object -->
  <line class="divider" x1="940" y1="824" x2="940" y2="970"/>
  <text class="primitive-title" x="1180" y="848">Info Primitive Object</text>
  <text class="primitive" x="985" y="874">
    <tspan x="985" dy="0"><tspan font-weight="700">type</tspan> — information bucket</tspan>
    <tspan x="985" dy="22"><tspan font-weight="700">subject</tspan> — hotel or related entity</tspan>
    <tspan x="985" dy="22"><tspan font-weight="700">statement</tspan> — supported observation</tspan>
    <tspan x="985" dy="22"><tspan font-weight="700">attributes</tspan> — values, rows, or matrices</tspan>
    <tspan x="985" dy="22">Evidence adds source, locator, excerpt, and method</tspan>
  </text>

  <!-- Downstream output skills -->
  <path class="line" d="M225 970 V1100"/>
  <path class="line" d="M575 970 V1100"/>
  <path class="line" d="M925 970 V1100"/>
  <path class="line" d="M1275 970 V1100"/>
  <rect class="label-mask" x="135" y="1015" width="180" height="44"/>
  <rect class="label-mask" x="475" y="998" width="200" height="78"/>
  <rect class="label-mask" x="835" y="998" width="180" height="78"/>
  <rect class="label-mask" x="1185" y="1015" width="180" height="44"/>
  <text class="skill" x="225" y="1037">UW Model Skill</text>
  <text class="skill" x="575" y="1023">
    <tspan x="575" dy="0">Market Analysis</tspan>
    <tspan x="575" dy="34">Skill</tspan>
  </text>
  <text class="skill" x="925" y="1023">
    <tspan x="925" dy="0">CBA Abstract</tspan>
    <tspan x="925" dy="34">Skill</tspan>
  </text>
  <text class="skill" x="1275" y="1037">IC Memo Skill</text>

  <rect class="box" x="60" y="1120" width="1380" height="88"/>
  <text class="title" x="750" y="1164">Outputs</text>
</svg>
